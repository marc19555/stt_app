services:
  pipeline_worker:
    build:
      context: ./pipeline_worker
      dockerfile: Dockerfile
      args:
        INSTALL_DIARIZATION: ${DIARIZATION_ENABLED:-false}
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env.local
    environment:
      HF_HOME: /root/.cache/huggingface
      OLLAMA_URL: http://host.docker.internal:11435
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      DIARIZATION_ENABLED: ${DIARIZATION_ENABLED:-false}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-granite4.1:3b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-qwen3.5:0.8b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-2048}
      DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS:-7}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 3g
    memswap_limit: 5g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  hf_cache:
