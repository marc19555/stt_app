services:
  stt-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stt_app
    ports:
      - "8888:8888"
    volumes:
      - ./input:/app/input
      - ./outputs:/app/outputs
      - ./.env.local:/app/.env.local:ro
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: "11434"
      OLLAMA_MODEL: qwen3.5:9b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
