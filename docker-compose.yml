services:
  pipeline_worker:
    build:
      context: ./pipeline_worker
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env.local
    environment:
      HF_HOME: /root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  hf_cache:
